name: Demo and solver smoke

on:
  push:
    paths:
      - 'python/ns_exploration/**'
      - 'pyproject.toml'
      - '.github/workflows/demo-ci.yml'
  pull_request:
    paths:
      - 'python/ns_exploration/**'
      - 'pyproject.toml'
      - '.github/workflows/demo-ci.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Demo (budget-capped)
        run: python -m ns_exploration.demo --n 8 --t-end 0.01 --out-dir demos/out/ci
        timeout-minutes: 5
      - name: Solver + demo tests
        run: |
          pytest python/ns_exploration/tests/test_sprint01.py \
                 python/ns_exploration/tests/test_demo.py -q --tb=line
        timeout-minutes: 10

  # Heavy C-0008 / gmpy2 band workflow remains separate and path-filtered:
  # .github/workflows/c0008-repair-band.yml
